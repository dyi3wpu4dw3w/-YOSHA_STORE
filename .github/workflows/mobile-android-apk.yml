name: Build YOSHA STORE Android APK

on:
  push:
    branches:
      - feature/yosha-mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Validate and build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yosha-store-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
